<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="gradient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <main id="app">
    <!-- Welcome -->
    <section id="welcome" class="view view-active">
      <div class="glass-card welcome-card">
        <div class="portrait-frame">
          <div class="portrait-placeholder" id="portrait">
            <img src="assets/portrait/photo.jpg" alt="Портрет">
          </div>
        </div>
        <h1 class="welcome-title">Добро пожаловать</h1>
        <p class="welcome-subtitle">Портфолио дизайнера</p>
        <button class="glass-btn primary" data-nav="categories">
          Далее
          <span class="btn-arrow">→</span>
        </button>
      </div>
    </section>

    <!-- Categories -->
    <section id="categories" class="view">
      <header class="page-header page-header--centered">
        <h2>Категории</h2>
      </header>
      <div class="categories-grid">
        <article class="glass-card category-card" data-category="magazines">
          <div class="category-icon">📖</div>
          <h3>Журналы</h3>
          <p>PDF-издания и публикации</p>
        </article>
        <article class="glass-card category-card" data-category="videos">
          <div class="category-icon">🎬</div>
          <h3>Видео</h3>
          <p>Ролики и анимация</p>
        </article>
        <article class="glass-card category-card" data-category="works">
          <div class="category-icon">✦</div>
          <h3>Векторные и растровые работы</h3>
          <p>Иллюстрации и графика</p>
        </article>
      </div>
    </section>

    <!-- Category gallery -->
    <section id="gallery" class="view">
      <header class="page-header">
        <button class="glass-btn icon-btn back-btn" data-nav="categories" aria-label="Назад">←</button>
        <h2 id="gallery-title">Категория</h2>
      </header>
      <div class="gallery-grid" id="gallery-grid"></div>
    </section>
  </main>

  <!-- Video modal -->
  <dialog id="video-modal" class="glass-modal media-modal">
    <div class="modal-inner">
      <button class="modal-close" data-close="video-modal" aria-label="Закрыть">×</button>
      <h3 id="video-title"></h3>
      <div class="video-wrapper">
        <video id="video-player" controls playsinline></video>
      </div>
    </div>
  </dialog>

  <!-- PDF modal -->
  <dialog id="pdf-modal" class="glass-modal pdf-modal">
    <div class="modal-inner">
      <button class="modal-close" data-close="pdf-modal" aria-label="Закрыть">×</button>
      <h3 id="pdf-title"></h3>
      <div class="pdf-wrapper">
        <iframe id="pdf-viewer" title="PDF просмотр"></iframe>
      </div>
    </div>
  </dialog>

  <!-- Image modal -->
  <dialog id="image-modal" class="glass-modal media-modal">
    <div class="modal-inner">
      <button class="modal-close" data-close="image-modal" aria-label="Закрыть">×</button>
      <h3 id="image-title"></h3>
      <div class="image-wrapper">
        <img id="image-viewer" alt="">
      </div>
    </div>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
